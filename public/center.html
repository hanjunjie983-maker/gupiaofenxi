<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>范蠡罗盘 · 统一中心</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar"><h1>统一投资中心</h1><p>股票、基金、统一规划一处切换</p></header>
  <div id="main-nav"></div>
  <main class="container">
    <div class="searchbar">
      <input id="center-capital" type="number" value="1000000" title="总资金" />
      <select id="center-risk"><option value="conservative">保守</option><option value="balanced" selected>稳健</option><option value="aggressive">进取</option></select>
      <button id="center-run">刷新统一中心</button>
    </div>
    <section class="card"><h2>怎么看这个页面</h2><p>先看评分，再看建议；概率越高只代表历史统计倾向越强，不是保证上涨。股票和基金都可以点进去看详细解释。</p></section>
    <div class="tabs">
      <button class="tab active" data-tab="stocks">股票推荐</button>
      <button class="tab" data-tab="funds">基金推荐</button>
      <button class="tab" data-tab="plan">统一规划</button>
    </div>
    <section class="card tab-panel" id="tab-stocks"><h2>股票推荐</h2><div id="center-stocks" class="content">加载中…</div></section>
    <section class="card tab-panel hidden" id="tab-funds"><h2>基金推荐</h2><div id="center-funds" class="content">加载中…</div></section>
    <section class="card tab-panel hidden" id="tab-plan"><h2>统一规划</h2><div id="center-plan" class="content">加载中…</div></section>
  </main>
  <footer class="footer">不构成投资建议</footer>
  
  <script src="/js/nav.js"></script>
  <script src="/js/center.js"></script>
</body>
</html>

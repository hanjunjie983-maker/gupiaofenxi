<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>范蠡罗盘 · 基金分析</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>基金分析</h1>
    <p><a href="/">返回股票分析</a> · 基于前十大持仓与股票分析进行基金剖解</p>
  </header>
  <div id="main-nav"></div>
  <main class="container">
    <div class="searchbar">
      <input id="fund-code" placeholder="输入基金代码，例如 510300" value="510300" />
      <input id="fund-capital" type="number" value="1000000" title="总资金" />
      <select id="fund-risk"><option value="conservative">保守</option><option value="balanced" selected>稳健</option><option value="aggressive">进取</option></select>
      <button id="fund-query">分析基金</button>
    </div>
    <section class="card"><h2>基金详情</h2><div id="fund-detail" class="content">加载中…</div></section>
    <section class="card"><h2>基金构成建议</h2><div id="fund-portfolio" class="content">加载中…</div></section>
    <section class="card"><h2>每日十只基金推荐</h2><div id="fund-ranking" class="content">加载中…</div></section>
  </main>
  <footer class="footer">基金评分与推荐不构成投资建议</footer>
  
  <script src="/js/nav.js"></script>
  <script src="/js/fund.js"></script>
</body>
</html>
